<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>takuya gear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* 単一テーマ（ゲーム画面のため、ライト/ダークは切り替えない） */
  :root {
    color-scheme: dark;
    --ink: #121211;
    --text: #e8ecff;
    --text-dim: #9aa5d6;
    --gold: #f2c14e;
    --red: #ff5a5a;
    --cyan: #5fe1ff;
    --frame-hi: #2a3160;
    --panel: rgba(15, 18, 36, 0.82);
    --accent: #f2c14e;
    --c-tab: #141935; --c-tab-on: #1d2352; --c-head: #1d2352; --c-pane: rgba(10, 12, 26, 0.65);
    --c-card: #161b38; --c-card-max: #13241c; --c-max-border: #2f5a3a; --c-note: #0f1224;
    --pixel-font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", monospace;
  }
  html, body { height: 100%; }
  /* スマホでタップしたときの青い四角（タップハイライト）・選択色・フォーカス枠を出さない */
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
  ::selection { background: transparent; }
  :focus:not(:focus-visible) { outline: none; }
  img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--pixel-font);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
  /* 縦持ちのときは #view ごと90度回して、常に横画面と同じ見た目にする */
  #view {
    position: absolute; left: 50%; top: 50%;
    display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%);
  }
  body[data-portrait="on"] #view { transform: translate(-50%, -50%) rotate(90deg); }
  #board { position: relative; flex: none; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }

  .layer { position: absolute; inset: 0; pointer-events: none; line-height: 1; }
  #hud { font-size: calc(var(--u) * 8); }
  #wTitle { pointer-events: auto; cursor: default; padding-block: calc(2 * var(--u)); margin-top: calc(-2 * var(--u)); }   /* 隠しボタン：STAGE を15回連続で押す */
  .h, .lbl {
    position: absolute;
    white-space: nowrap;
    color: var(--text);
    text-shadow: var(--u) var(--u) 0 var(--ink);
  }
  .dim { color: var(--text-dim); }
  .gold { color: var(--gold); }
  .c { transform: translateX(-50%); text-align: center; }
  .r { transform: translateX(-100%); text-align: right; }
  .big { font-size: calc(var(--u) * 14); }
  .log { max-width: calc(var(--u) * 144); overflow: hidden; }
  #wRight.alert, .red { color: var(--red); }

  #banner { font-size: calc(var(--u) * 18); letter-spacing: calc(var(--u) * 1); opacity: 0; transform: translate(-50%, -50%); }
  #banner.show { animation: bn 1.5s steps(12) forwards; }
  #banner.gold { color: var(--gold); }
  #banner.white { color: var(--text); }
  @keyframes bn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }
  #fx { position: absolute; inset: 0; }
  #bossBar { font-size: calc(var(--u) * 8); padding: calc(1 * var(--u)) calc(5 * var(--u)); background: rgba(6, 10, 14, 0.7); border: var(--u) solid #6a2a2a; letter-spacing: calc(0.5 * var(--u)); }
  /* 左上の窓：プレイキャラの画像 */
  #portrait {
    position: absolute; left: calc((var(--side) + 4) * var(--u)); top: calc(4 * var(--u));
    width: calc(152 * var(--u)); height: calc(172 * var(--u));
    overflow: hidden; pointer-events: none; background: #000;
  }
  #portImg { display: block; width: 100%; height: 100%; object-fit: cover; }
  #portFx { position: absolute; inset: 0; }
  #portrait.hyo #portImg { opacity: 0.55; }
  #portrait.alert #portFx { box-shadow: inset 0 0 calc(12 * var(--u)) rgba(220, 40, 30, 0.75); animation: pal 0.5s steps(2) infinite; }
  #portrait.yaj #portFx { box-shadow: inset 0 0 calc(16 * var(--u)) rgba(255, 90, 40, 0.95); }
  #portrait.pain #portImg { animation: pshake 0.12s steps(2) infinite; }
  @keyframes pal { 50% { box-shadow: inset 0 0 calc(4 * var(--u)) rgba(220, 40, 30, 0.4); } }
  @keyframes pshake { 50% { transform: translate(calc(2 * var(--u)), calc(-1 * var(--u))); } }
  @media (prefers-reduced-motion: reduce) { #portrait.alert #portFx, #portrait.pain #portImg { animation: none; } }
  .pop {
    position: absolute;
    font-size: calc(var(--u) * 7);
    white-space: nowrap;
    color: var(--text);
    text-shadow: var(--u) var(--u) 0 var(--ink);
    transform: translate(-50%, -100%);
    animation: rise 0.95s steps(8) forwards;
  }
  .pop.gold { color: var(--gold); }
  .pop.red { color: var(--red); }
  .pop.cyan { color: var(--cyan); }
  .pop.big { font-size: calc(var(--u) * 9); }
  @keyframes rise {
    0% { transform: translate(-50%, -100%); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(-50%, calc(-100% - var(--u) * 12)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pop { animation: fade 0.95s forwards; }
    #banner.show { animation: fade 1.5s forwards; }
    @keyframes fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  }


  /* 下段：操作エリア（ゲームピクセル --u 単位で配置） */
  #ctrl {
    position: absolute;
    left: calc(var(--side) * var(--u)); top: calc(183 * var(--u));
    width: calc(480 * var(--u)); height: calc(87 * var(--u));
    font-size: calc(var(--u) * 7); line-height: 1.2;
  }
  #tabs { position: absolute; left: calc(4 * var(--u)); top: calc(2 * var(--u)); width: calc(58 * var(--u)); display: flex; flex-direction: column; gap: calc(2 * var(--u)); }
  .tab, .up, .sbtn, #yaju { font: inherit; border-radius: 0; cursor: pointer; touch-action: manipulation; }
  .tab {
    height: calc(18 * var(--u)); padding: 0;
    font-size: calc(8 * var(--u)); color: var(--text-dim);
    background: var(--c-tab); border: var(--u) solid var(--frame-hi);
  }
  .tab[aria-selected="true"] { color: var(--accent); border-color: var(--accent); background: var(--c-tab-on); }
  #pane { position: absolute; left: calc(66 * var(--u)); top: calc(2 * var(--u)); width: calc(334 * var(--u)); height: calc(82 * var(--u)); background: var(--c-pane); border: var(--u) solid var(--frame-hi); }
  #paneHead { height: calc(11 * var(--u)); display: flex; justify-content: space-between; align-items: center; gap: calc(4 * var(--u)); padding: 0 calc(4 * var(--u)); background: var(--c-head); white-space: nowrap; overflow: hidden; }
  #paneTitle { flex: 1; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  #wallet { flex: none; color: var(--gold); font-variant-numeric: tabular-nums; }
  #hpMini { flex: none; display: flex; align-items: center; gap: calc(2 * var(--u)); font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: calc(4 * var(--u)); background: #0e0e0d; border: var(--u) solid #000; }
  .bar.mini { width: calc(44 * var(--u)); height: calc(3 * var(--u)); }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #5ee07a; }
  .bar i + i { bottom: 50%; background: #6fd0ff; }
  .bar.low i:first-child { background: #ff6b6b; }
  #homePane { position: absolute; left: 0; right: 0; top: calc(11 * var(--u)); bottom: 0; padding: calc(3 * var(--u)) calc(5 * var(--u)); display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: calc(6 * var(--u)); }
  .hcol { min-width: 0; display: flex; flex-direction: column; gap: calc(2 * var(--u)); white-space: nowrap; }
  .hcol > div { overflow: hidden; text-overflow: ellipsis; }
  #statusChip { padding: calc(1 * var(--u)) calc(3 * var(--u)); text-align: center; color: #fff; border: var(--u) solid rgba(255,255,255,0.12); }
  #homePane .big { font-size: calc(12 * var(--u)); line-height: 1.1; }
  #homePane .log { max-width: none; }
  #cards {
    position: absolute; left: 0; right: 0; top: calc(11 * var(--u)); bottom: 0;
    overflow-y: auto; padding: calc(2 * var(--u));
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(2 * var(--u)); align-content: start;
    scrollbar-width: thin; scrollbar-color: var(--frame-hi) transparent;
  }
  .grp { grid-column: 1 / -1; color: var(--gold); padding: calc(1 * var(--u)) calc(2 * var(--u)) 0; }
  .up {
    text-align: left; color: var(--text); background: var(--c-card); border: var(--u) solid var(--frame-hi);
    padding: calc(2 * var(--u)) calc(3 * var(--u)); display: flex; flex-direction: column; gap: calc(1 * var(--u));
    min-height: calc(32 * var(--u)); min-width: 0;
  }
  .up span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up .uv { color: var(--cyan); }
  .up .uc { color: var(--gold); }
  .up.poor { opacity: 0.7; }
  .up.poor .uc { color: var(--red); }
  .up.max { border-color: var(--c-max-border); background: var(--c-card-max); }
  .up.max .uc { color: #5ee07a; }
  .up.back { background: var(--c-tab-on); border-color: var(--accent); }
  .up.back .un { color: var(--accent); }
  .up.wsel .un { color: var(--gold); }
  .up.tog { border-style: dashed; }
  .up.tog.on { border-style: solid; border-color: #5ee07a; background: var(--c-card-max); }
  .up.tog.on .un { color: #5ee07a; }
  .up.tog .uc { color: var(--text-dim); }
  .up:not(.poor):not(.max):hover { border-color: var(--accent); }
  .up:active { transform: translateY(var(--u)); }
  #setPane { position: absolute; left: 0; right: 0; top: calc(11 * var(--u)); bottom: 0; padding: calc(3 * var(--u)) calc(4 * var(--u)); display: flex; flex-direction: column; gap: calc(3 * var(--u)); overflow-y: auto; }
  .srow { display: flex; flex-wrap: wrap; align-items: center; gap: calc(3 * var(--u)); }
  .slbl { color: var(--text-dim); min-width: calc(34 * var(--u)); }
  .sbtn { height: calc(16 * var(--u)); padding: 0 calc(5 * var(--u)); color: var(--text); background: var(--c-card); border: var(--u) solid var(--frame-hi); }
  .sbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .sbtn.warn { border-color: var(--red); color: var(--red); }
  .ask { display: inline-flex; align-items: center; gap: calc(3 * var(--u)); color: var(--red); }
  #side { position: absolute; left: calc(404 * var(--u)); top: calc(2 * var(--u)); width: calc(72 * var(--u)); height: calc(82 * var(--u)); display: flex; flex-direction: column; gap: calc(3 * var(--u)); }
  #speed { height: calc(18 * var(--u)); font-size: calc(8 * var(--u)); }
  #yaju {
    position: relative; flex: 1; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(2 * var(--u));
    color: #fff; background: #5a1420; border: var(--u) solid #ff5a5a;
  }
  #yaju .yt { position: relative; font-size: calc(10 * var(--u)); letter-spacing: calc(0.5 * var(--u)); }
  #yaju .ys { position: relative; font-size: calc(7 * var(--u)); color: #ffd0d0; }
  #yajuFill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: rgba(0, 0, 0, 0.6); }
  #yaju.wait { border-color: #6a3040; cursor: default; }
  #yaju.on { background: #a01c2c; animation: yj 0.4s steps(2) infinite; }
  @keyframes yj { 50% { border-color: #ffd36b; } }
  .tab:focus-visible, .up:focus-visible, .sbtn:focus-visible, #yaju:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 会話モード（カットシーン） */
  #talk { position: absolute; inset: 0; z-index: 5; cursor: pointer; }
  #ending { position: absolute; inset: 0; z-index: 7; background: #000; overflow: hidden; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #endLogoBox { position: absolute; inset: 0; }
  /* オープニング */
  #op { position: absolute; inset: 0; z-index: 8; background: #000; overflow: hidden; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #opVis img { position: absolute; left: 0; top: 0; max-width: none; opacity: 0; will-change: transform, opacity; }
  #opFlash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #opSub { position: absolute; left: 50%; bottom: calc(16 * var(--u)); transform: translateX(-50%); width: max-content; max-width: 90%; box-sizing: border-box; padding: calc(4 * var(--u)) calc(10 * var(--u)); background: rgba(0, 0, 0, 0.6); color: #fff; font-size: calc(11 * var(--u)); line-height: 1.55; text-align: center; white-space: pre-line; opacity: 0; pointer-events: none;
    text-shadow: 0 0 calc(1 * var(--u)) #000, 0 0 calc(2 * var(--u)) #000; }
  #ldMsg { position: absolute; right: calc((var(--side) + 10) * var(--u)); bottom: calc(8 * var(--u)); z-index: 9; font-size: calc(8 * var(--u)); color: var(--gold); background: rgba(0, 0, 0, 0.6); padding: calc(2 * var(--u)) calc(6 * var(--u)); pointer-events: none; }
  #opTap { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: calc(12 * var(--u)); color: var(--gold); animation: tnext 1s steps(2) infinite; }
  #opSkip { position: absolute; right: calc((var(--side) + 12) * var(--u)); bottom: calc(5 * var(--u)); font-size: calc(7 * var(--u)); color: var(--text-dim); opacity: 0; pointer-events: none; text-align: right; }
  /* スタッフロール */
  .epage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
  .ehead { position: absolute; top: calc(14 * var(--u)); left: 0; right: 0; text-align: center; font-size: calc(9 * var(--u)); letter-spacing: 0.5em; color: var(--text-dim); }
  .crow { display: flex; align-items: flex-end; justify-content: center; gap: calc(16 * var(--u)); }
  .cc { display: flex; flex-direction: column; align-items: center; gap: calc(6 * var(--u)); }
  .cc .ph { height: calc(var(--h) * var(--u)); aspect-ratio: 152 / 172; border: var(--u) solid #4a4a44; background: #000; overflow: hidden; box-shadow: 0 0 calc(10 * var(--u)) rgba(0, 0, 0, 0.8); }
  .cc .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .crow.pair { gap: calc(8 * var(--u)); }
  .cn { font-size: calc(10 * var(--u)); color: var(--gold); white-space: nowrap; text-align: center; }
  .cn.sm { font-size: calc(8 * var(--u)); }
  .cn.big { font-size: calc(14 * var(--u)); color: #fff1c2; text-shadow: 0 0 calc(5 * var(--u)) rgba(255, 190, 60, 0.85); letter-spacing: 0.08em; }
  .cc.big .ph { border-color: #c9a24a; box-shadow: 0 0 calc(14 * var(--u)) rgba(255, 190, 60, 0.45); }
  #endStaff dl { display: grid; grid-template-columns: auto auto; column-gap: calc(18 * var(--u)); row-gap: calc(9 * var(--u)); margin: 0; font-size: calc(11 * var(--u)); }
  #endStaff dt { color: var(--text-dim); text-align: right; }
  #endStaff dd { margin: 0; color: #fff; }
  #endThanks { gap: calc(14 * var(--u)); }
  .et1 { font-size: calc(24 * var(--u)); color: #fff1c2; letter-spacing: 0.06em; text-shadow: 0 0 calc(8 * var(--u)) rgba(120, 255, 60, 0.45); }
  .et2 { font-size: calc(9 * var(--u)); color: var(--gold); }
  #endSkip { position: absolute; right: calc((var(--side) + 12) * var(--u)); bottom: calc(10 * var(--u)); font-size: calc(8 * var(--u)); color: var(--text-dim); opacity: 0; pointer-events: none; text-align: right; }
  .ebar { height: calc(1.5 * var(--u)); margin-top: calc(3 * var(--u)); background: rgba(255, 255, 255, 0.12); }
  #endThanks .ebar { width: calc(110 * var(--u)); }
  .ebar i { display: block; height: 100%; width: 0; background: var(--gold); }
  #endLogo { position: absolute; left: 50%; top: 47%; width: min(90%, calc(250 * var(--u) * 1690 / 931)); transform: translate(-50%, -50%) scale(1); opacity: 0; }
  #ending.go #endLogo { animation: logoSlam 0.42s cubic-bezier(0.2, 0.8, 0.3, 1.1) 0.45s both, logoGlow 2.4s ease-in-out 1.2s infinite; }
  #ending.go { animation: endShake 0.32s linear 0.8s both; }
  #endFlash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #ending.go #endFlash { animation: endFlash 0.6s ease-out 0.72s both; }
  @keyframes logoSlam {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(2.6); filter: brightness(3) blur(3px); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(0.94); filter: brightness(1.8); }
    80% { transform: translate(-50%, -50%) scale(1.03); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: none; }
  }
  @keyframes logoGlow { 0%, 100% { opacity: 1; filter: none; } 50% { opacity: 1; filter: brightness(1.18) saturate(1.15); } }
  @keyframes endFlash { 0% { opacity: 0; } 12% { opacity: 0.85; } 100% { opacity: 0; } }
  @keyframes endShake { 0%, 100% { transform: none; } 20% { transform: translate(calc(-3 * var(--u)), calc(2 * var(--u))); } 40% { transform: translate(calc(3 * var(--u)), calc(-2 * var(--u))); } 60% { transform: translate(calc(-2 * var(--u)), calc(-1 * var(--u))); } 80% { transform: translate(calc(1 * var(--u)), calc(1 * var(--u))); } }
  #talkFade { position: absolute; inset: 0; z-index: 6; background: #000; pointer-events: none; opacity: 0; }
  /* STAGE 100 突入前のカットシーン（一枚絵） */
  #cut { position: absolute; inset: 0; z-index: 7; background: #000; overflow: hidden; cursor: pointer; }
  #cut img { position: absolute; left: 0; top: 0; max-width: none; image-rendering: auto; will-change: transform; }
  #cutFlash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #cutCap { position: absolute; left: 3%; bottom: 6%; padding: calc(var(--u) * 6) calc(var(--u) * 10) calc(var(--u) * 6) calc(var(--u) * 6); opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse at 35% 55%, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.45) 50%, transparent 75%); }
  #cutCap span { display: block; font-family: 'Arial Black', 'Helvetica Neue', Impact, sans-serif; font-weight: 900; font-style: italic;
    font-size: calc(var(--u) * 23); letter-spacing: 0.06em; line-height: 1; color: #ffb02e;
    background: linear-gradient(180deg, #fff3c4 0%, #ffb02e 45%, #ff5a1a 55%, #c2281a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 calc(var(--u) * 1) #1a0612) drop-shadow(0 0 calc(var(--u) * 4) rgba(255, 70, 30, 0.6)); }
  #cutCap i { display: block; height: calc(var(--u) * 1.5); margin-top: calc(var(--u) * 3); background: linear-gradient(90deg, #ff4c21, #ff4ca8 70%, transparent); transform-origin: left; }
  #talkR { position: absolute; left: calc((var(--side) + 324) * var(--u)); top: calc(4 * var(--u)); width: calc(152 * var(--u)); height: calc(172 * var(--u)); overflow: hidden; background: #000; pointer-events: none; }
  #talkRImg { display: block; width: 100%; height: 100%; object-fit: cover; }
  #portImg, #talkRImg { transition: filter 0.15s; }
  #portrait.talkdim #portImg, #talkR.talkdim #talkRImg { filter: brightness(0.45) saturate(0.7); }
  #talkLcd { position: absolute; left: calc((var(--side) + 206) * var(--u)); top: calc(34 * var(--u)); width: calc(68 * var(--u)); text-align: center; color: #1e2a14; font-size: calc(7 * var(--u)); line-height: 1.35; pointer-events: none; }
  #talkWin { position: absolute; left: calc((var(--side) + 4) * var(--u)); top: calc(188 * var(--u)); width: calc(472 * var(--u)); height: calc(78 * var(--u)); box-sizing: border-box; background: rgba(18, 18, 16, 0.95); border: var(--u) solid #8f8e85; box-shadow: 0 0 0 var(--u) #0e0e0d, inset 0 0 0 var(--u) #3a3935; }

  #talkText { position: absolute; left: calc(12 * var(--u)); right: calc(12 * var(--u)); top: calc(13 * var(--u)); bottom: calc(8 * var(--u)); font-size: calc(10 * var(--u)); line-height: 1.6; color: var(--text); white-space: pre-wrap; text-shadow: var(--u) var(--u) 0 var(--ink); overflow: hidden; }

<script>
(function () {
  'use strict';

  // ===== 画面の寸法（ゲームピクセル。1 = 1920×1080基準の4px） =====

  var T = 12, MW = 26, MH = 13, N = MW * MH;
  var MX = 164, MY = 18;                 // マップ左上（中央画面内の座標）
  var LAST = 100;                        // 全ステージ数
  var VIS = 4.2;                         // 地形を把握できる距離（マス）
  var SAVE_KEY = 'ketsuman-stealth-v1';
  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

  var $ = function (id) { return document.getElementById(id); };
  var stageEl = $('stage'), view = $('view'), board = $('board'), canvas = $('screen');
  var ctx = canvas.getContext('2d');
  var bg = document.createElement('canvas');

  mapLayer.width = MW * T; mapLayer.height = MH * T;
  var side = 0, gw = CW;

  function place(el, x, y) {
    el.style.left = 'calc((var(--side) + ' + x + ') * var(--u))';
    el.style.top = 'calc(' + y + ' * var(--u))';
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-x]'), function (el) {
    place(el, +el.dataset.x, +el.dataset.y);
  });

  // ===== 保存 =====
  // uri：正式に入手したウリクル値 / uriPend：今回の周回で拾った仮のウリクル値（死んだら正式入手）
  function freshSave() { return { stage: 1, best: 0, ketsu: 0, kills: 0, misses: 0, uri: 0, uriPend: 0, uriAt: 0, uriEver: false, charIdx: 0, noDie: false, noDieNote: false, talks: {}, up: {} }; }
  var save = freshSave();
  function applySave(d) {
    if (!d || typeof d !== 'object') return;
    ['stage', 'best', 'ketsu', 'kills', 'misses', 'uri', 'uriPend', 'uriAt', 'charIdx'].forEach(function (k) {
      if (typeof d[k] === 'number' && isFinite(d[k])) save[k] = d[k];
    });
    save.uriEver = !!d.uriEver; save.noDie = !!d.noDie; save.noDieNote = !!d.noDieNote;
    save.talks = {};
    if (d.talks && typeof d.talks === 'object') for (var tk in d.talks) if (d.talks[tk]) save.talks[tk] = true;
    save.up = {};
    if (d.up && typeof d.up === 'object') for (var k in d.up) if (typeof d.up[k] === 'number' && isFinite(d.up[k])) save.up[k] = Math.max(0, Math.floor(d.up[k]));
    save.stage = Math.min(LAST + 1, Math.max(1, Math.floor(save.stage)));   // LAST+1 は「クリア後」
    save.charIdx = ((Math.floor(save.charIdx) % 3) + 3) % 3;
  }
  function readSave() { try { var s = localStorage.getItem(SAVE_KEY); if (s) applySave(JSON.parse(s)); } catch (e) {} }
  function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  function lv(id) { return save.up[id] || 0; }

  // ===== アップグレード一覧 =====
  // tab：kyo 強化 / bu 武装 / uri ウリ狂。cost(l) は {k: ケツマン, u: ウリクル}
  function geo(base, r) { return function (l) { return { k: Math.round(base * Math.pow(r, l)) }; }; }
  function uriCost(a, b) { return function (l) { return { u: a + b * l }; }; }
  function f2(v) { return String(Math.round(v * 100) / 100); }
  function sec(v) { return f2(v) + '秒'; }
  function has(id) { return function () { return lv(id) > 0; }; }
  var UPS = [
    // --- 強化（ケツマン値） ---
    { id: 'spd', tab: 'kyo', name: '移動速度', max: 40, cost: geo(30, 1.45), val: function (l) { return 2.2 + 0.12 * l; }, fmt: f2 },   // 2.2 → 7.0
    { id: 'sen', tab: 'kyo', name: '気配察知', max: 14, cost: geo(40, 1.55), val: function (l) { return 2.5 + 0.25 * l; }, fmt: function (v) { return f2(v) + 'マス'; } },
    { id: 'hp', tab: 'kyo', name: '体力', max: 30, cost: geo(50, 1.5), val: function (l) { return 1 + l; }, fmt: f2 },
    { id: 'atk', tab: 'kyo', name: 'ビンタ攻撃力', max: 50, cost: geo(35, 1.45), val: function (l) { return 1 + l; }, fmt: f2 },
    { id: 'def', tab: 'kyo', name: '防御', max: 15, cost: geo(60, 1.6), val: function (l) { return 4 * l; }, fmt: function (v) { return v + '%'; } },

    // --- ウリ狂（ウリクル値） ---
    { id: 'u_vul', tab: 'uri', name: 'カルパスバルカン', max: 1, cost: uriCost(1, 0), info: '遠距離攻撃を解放' },
    { id: 'u_gren', tab: 'uri', name: 'グレネーコ゜ッ！', max: 1, cost: uriCost(3, 0), info: '毒ガス玉を解放' },
    { id: 'u_hyo', tab: 'uri', name: 'ヒョウモンステルス', max: 1, cost: uriCost(5, 0), info: '一定時間見つからない' },
    { id: 'u_shower', tab: 'uri', name: 'シャワーも浴びずに', max: 1, cost: uriCost(6, 0), info: 'ステルス中の接近で攻撃', show: has('u_hyo') },
    { id: 'u_yaj', tab: 'uri', name: '野獣モード', max: 1, cost: uriCost(10, 0), info: 'ボタンで発動する強化' },
    { id: 'u_kgain', tab: 'uri', name: 'ケツマン獲得量', max: 20, cost: uriCost(2, 2), val: function (l) { return 100 + 25 * l; }, fmt: function (v) { return v + '%'; } },

    // --- 武装：カルパスバルカン ---
    { id: 'w_vul_dmg', tab: 'bu', grp: 'カルパスバルカン', name: '威力', max: 30, cost: geo(60, 1.5), val: function (l) { return 1 + 0.6 * l; }, fmt: f2, show: has('u_vul') },
    { id: 'w_vul_rate', tab: 'bu', grp: 'カルパスバルカン', name: '連射', max: 5, cost: geo(150, 1.9), val: function (l) { return 1 + l; }, fmt: function (v) { return v + '連'; }, show: has('u_vul') },
    { id: 'w_vul_rng', tab: 'bu', grp: 'カルパスバルカン', name: '射程', max: 10, cost: geo(80, 1.5), val: function (l) { return 4 + 0.5 * l; }, fmt: function (v) { return f2(v) + 'マス'; }, show: has('u_vul') },
    { id: 'w_vul_prc', tab: 'bu', grp: 'カルパスバルカン', name: '敵を貫通', max: 4, cost: uriCost(1, 1), val: function (l) { return l; }, fmt: function (v) { return v + '体'; }, show: has('u_vul') },
    { id: 'w_vul_wall', tab: 'bu', grp: 'カルパスバルカン', name: '壁抜け', max: 1, cost: uriCost(3, 0), info: '壁を貫通して撃つ', show: has('u_vul') },
    { id: 'w_vul_cd', tab: 'bu', grp: 'カルパスバルカン', name: '再使用時間', max: 10, cost: geo(100, 1.6), val: function (l) { return 3 * Math.pow(0.9, l); }, fmt: sec, show: has('u_vul') },
    // --- 武装：グレネーコ゜ッ！ ---
    { id: 'w_gr_dmg', tab: 'bu', grp: 'グレネーコ゜ッ！', name: '毒ガス威力', max: 30, cost: geo(80, 1.5), val: function (l) { return 1.5 + 0.8 * l; }, fmt: function (v) { return f2(v) + '/秒'; }, show: has('u_gren') },
    { id: 'w_gr_rng', tab: 'bu', grp: 'グレネーコ゜ッ！', name: '射程', max: 8, cost: geo(90, 1.5), val: function (l) { return 3.5 + 0.4 * l; }, fmt: function (v) { return f2(v) + 'マス'; }, show: has('u_gren') },
    { id: 'w_gr_dur', tab: 'bu', grp: 'グレネーコ゜ッ！', name: 'ガス持続', max: 10, cost: geo(100, 1.55), val: function (l) { return 2.5 + 0.5 * l; }, fmt: sec, show: has('u_gren') },
    { id: 'w_gr_rad', tab: 'bu', grp: 'グレネーコ゜ッ！', name: 'ガス範囲', max: 6, cost: uriCost(1, 1), val: function (l) { return 2 + 0.4 * l; }, fmt: function (v) { return f2(v) + 'マス'; }, show: has('u_gren') },
    { id: 'w_gr_cd', tab: 'bu', grp: 'グレネーコ゜ッ！', name: '再使用時間', max: 10, cost: geo(120, 1.6), val: function (l) { return 8 * Math.pow(0.9, l); }, fmt: sec, show: has('u_gren') },
    // --- 武装：ヒョウモンステルス ---
    { id: 'w_hy_dur', tab: 'bu', grp: 'ヒョウモンステルス', name: '効果時間', max: 12, cost: geo(100, 1.55), val: function (l) { return 3 + 0.8 * l; }, fmt: sec, show: has('u_hyo') },
    { id: 'w_hy_aura', tab: 'bu', grp: 'ヒョウモンステルス', name: '接近ダメージ', max: 20, cost: geo(90, 1.5), val: function (l) { return 1 + l; }, fmt: function (v) { return f2(v) + '/秒'; }, show: has('u_shower') },
    { id: 'w_hy_cd', tab: 'bu', grp: 'ヒョウモンステルス', name: '再使用時間', max: 10, cost: geo(120, 1.6), val: function (l) { return 18 * Math.pow(0.9, l); }, fmt: sec, show: has('u_hyo') },
    // --- 武装：野獣モード ---
    { id: 'w_yj_dur', tab: 'bu', grp: '野獣モード', name: '維持時間', max: 10, cost: geo(150, 1.6), val: function (l) { return 6 + l; }, fmt: sec, show: has('u_yaj') },
    { id: 'w_yj_pow', tab: 'bu', grp: '野獣モード', name: '野獣の力', max: 10, cost: geo(200, 1.7), val: function (l) { return 1.5 + 0.25 * l; }, fmt: function (v) { return '攻撃×' + f2(v); }, show: has('u_yaj') },
    { id: 'w_yj_spd', tab: 'bu', grp: '野獣モード', name: '移動速度倍率', max: 16, cost: geo(180, 1.6), val: function (l) { return 1.4 + 0.1 * l; }, fmt: function (v) { return '速さ×' + f2(v); }, show: has('u_yaj') },
    { id: 'w_yj_sh', tab: 'bu', grp: '野獣モード', name: 'シールド', max: 15, cost: geo(120, 1.55), val: function (l) { return 2 + 2 * l; }, fmt: f2, show: has('u_yaj') },
    { id: 'w_yj_cd', tab: 'bu', grp: '野獣モード', name: '再使用時間', max: 10, cost: geo(200, 1.6), val: function (l) { return 45 * Math.pow(0.9, l); }, fmt: sec, show: has('u_yaj') }
  ];
  var UPMAP = {};
  UPS.forEach(function (u) { UPMAP[u.id] = u; });
  function upVal(id) { return UPMAP[id].val(lv(id)); }

  // プレイヤーの能力（初期値＋強化）
  function stats() {
    return { speed: upVal('spd'), sense: upVal('sen'), maxHp: upVal('hp'), atk: upVal('atk'), def: upVal('def') / 100 };
  }
  // 武装の性能
  function W() {
    var yp = lv('w_yj_pow');
    return {
      vul: { on: lv('u_vul') > 0, dmg: upVal('w_vul_dmg'), vol: upVal('w_vul_rate'), range: upVal('w_vul_rng'), pierce: upVal('w_vul_prc'), wall: lv('w_vul_wall') > 0, cd: upVal('w_vul_cd') },
      gren: { on: lv('u_gren') > 0, dps: upVal('w_gr_dmg'), range: upVal('w_gr_rng'), dur: upVal('w_gr_dur'), rad: upVal('w_gr_rad'), cd: upVal('w_gr_cd') },
      hyo: { on: lv('u_hyo') > 0, dur: upVal('w_hy_dur'), cd: upVal('w_hy_cd'), shower: lv('u_shower') > 0, aura: upVal('w_hy_aura') },
      yaj: { on: lv('u_yaj') > 0, dur: upVal('w_yj_dur'), atk: upVal('w_yj_pow'), speed: upVal('w_yj_spd'), cdRate: 2 + 0.3 * yp, shield: upVal('w_yj_sh'), cd: upVal('w_yj_cd') }
    };
  }
  // 周回中に持ち越す武装の再使用時間（死んだらリセット）
  var RUN = { cd: { vul: 0, gren: 0, hyo: 0, yaj: 0 } };

  // ===== 小道具 =====
  function rnd() { return Math.random(); }
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function normA(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
  function angDiff(a, b) { return Math.abs(normA(a - b)); }
  function turnToward(e, target, rate, dt) {
    var d = normA(target - e.ang), s = rate * dt;
    e.ang = Math.abs(d) <= s ? normA(target) : normA(e.ang + (d > 0 ? s : -s));
  }
  function tileOf(e) { return Math.floor(e.py / T) * MW + Math.floor(e.px / T); }
  function mult() { return Math.pow(1.09, G ? G.stage - 1 : 0); }
  // 10000以下はそのまま、10000を超えたら科学的表記（例：12345 → 1.23e4）
  function fmt(n) {
    n = Math.floor(n);
    if (n <= 1e4) return String(n);

  // ===== 敵の行動 =====

    var P = G.player;

  function updEnemyAlert(e, dt) {

    var see = P.hyoT <= 0 && P.mode !== 'dead' && P.mode !== 'clear' && dist <= 6 && los(e.px / T, e.py / T, P.px / T, P.py / T);
    if (see) {

  // ===== プレイヤー =====
  function reveal() {

  var DANGER = new Float32Array(N), OCC = new Uint8Array(N);

  function think() {

    var w = rush ? 0 : 40;
    dijkstra(pt, function (v) {

      return 1.8 + DANGER[v] * w;
    });

    var target = -1, bestC = Infinity, i;
    // 1. 見つけたアイテムを優先して取りに行く
    G.items.forEach(function (it) {
      if (it.taken || !G.known[it.i]) return;
      var c = DIST[it.i];
      if (c < 25 && c < bestC) { bestC = c; target = it.i; }
    });
    // 2. 背後を取れる敵がいれば倒しに行く
    if (target < 0) {
      sensed.forEach(function (e) {
        if (e.state !== 'normal') return;
        var et = tileOf(e), ex = et % MW, ey = (et / MW) | 0;
        for (var k = 0; k < 4; k++) {

  function movePlayer(P, t) {

  }
  function alertThink(P, pt) {

    });

    G.enemies.forEach(function (e) {

    });

  function tryChoke(P) {

  function hurtPlayer(dmg) {

  // 「死なないんだよな？」（STAGE 10 クリアで強化に追加。ON/OFFできる）

  function updPlayer(dt) {
    var P = G.player;

    if (P.atkT > 0) P.atkT = Math.max(0, P.atkT - dt);

  // ===== 武装 =====
  var WP = null;   // その時点の武装性能（毎ステップ更新）
  function atkMult() { var P = G.player; return (P.atkT > 0 ? 2 : 1) * (P.yajT > 0 ? WP.yaj.atk : 1); }
  function usable(e) { return e.state !== 'dead' && e.state !== 'choked' && e.spawnT <= 0; }

  // 敵へのダメージ（倒せなければ気づかれる。毒ガスと接近ダメージ、ステルス中の攻撃は気づかれない）
  function damageEnemy(e, dmg, src) {
    if (e.state === 'dead') return;
    e.hp -= dmg;
    e.flash = Math.max(e.flash, src === 'gas' || src === 'aura' ? 0.05 : 0.12);
    if (e.hp <= 0) { killEnemy(e, src); return; }
    if (e.state === 'normal' && src !== 'gas' && src !== 'aura' && G.player.hyoT <= 0) triggerAlert(e);
  }

  // --- カルパスバルカン ---
  function canShoot(P, e) {
    var d = Math.hypot(e.px - P.px, e.py - P.py) / T;
    if (d > WP.vul.range) return false;
    if (los(P.px / T, P.py / T, e.px / T, e.py / T)) return true;
    return WP.vul.wall && e.sensed;          // 壁抜けは、気配で分かる相手だけ
  }
  function pickVulTarget(any) {
    var P = G.player, best = null, bd = Infinity;
    var total = WP.vul.dmg * atkMult() * 2 * WP.vul.vol;
    G.enemies.forEach(function (e) {
      if (!usable(e) || !canShoot(P, e)) return;
      // 見つかっていないときは、撃ち切れば倒せる相手だけを狙う（撃ち漏らすと気づかれる）
      if (!any && !G.alert && P.hyoT <= 0 && e.state === 'normal' && total < e.hp) return;
      var d = Math.hypot(e.px - P.px, e.py - P.py);
      if (d < bd) { bd = d; best = e; }
    });
    return best;
  }
  function useVul(tgt) {
    var P = G.player;
    RUN.cd.vul = WP.vul.cd;
    P.vol = { n: WP.vul.vol, t: 0, tgt: tgt };
    popup(P.px, P.py - 20, 'カルパスバルカン！', 'cyan');
  }
  function fireSticks(P, tgt) {
    var a = Math.atan2((tgt.aimY != null ? tgt.aimY : tgt.py) - P.py, tgt.px - P.px), cs = Math.cos(a), sn = Math.sin(a), sp = 170;
    P.face = a;
    sfx('vulcan');
    for (var k = -1; k <= 1; k += 2) {           // 2本並べて発射
      G.sticks.push({
        x: P.px + cs * 5 - sn * 2 * k, y: P.py - 4 + sn * 5 + cs * 2 * k, vx: cs * sp, vy: sn * sp, ang: a,
        left: WP.vul.range * T, dmg: WP.vul.dmg * atkMult(), pierce: WP.vul.pierce, wall: WP.vul.wall, hit: []
      });
    }
  }
  function updSticks(dt) {
    for (var i = G.sticks.length - 1; i >= 0; i--) {
      var s = G.sticks[i], dx = s.vx * dt, dy = s.vy * dt;
      s.x += dx; s.y += dy; s.left -= Math.hypot(dx, dy);
      var tx = Math.floor(s.x / T), ty = Math.floor((s.y + 4) / T);
      var out = tx < 0 || ty < 0 || tx >= MW || ty >= MH;
      if (s.left <= 0 || out || (!s.wall && grid[ty * MW + tx] !== 0 && grid[ty * MW + tx] !== 4)) { burst(s.x, s.y, 2, '#c07040', 12); G.sticks.splice(i, 1); continue; }
      var Bo = G.boss;
      if (Bo && Bo.kind === 'masahiko' && bossVulnerable(Bo) && Math.abs(Bo.px - s.x) < 9 && Math.abs(Bo.py - 12 - s.y) < 15) { burst(s.x, s.y, 4, '#e0a060', 25); G.sticks.splice(i, 1); bossHit(); continue; }
      if (Bo && Bo.kind === 'final' && finalVuln(Bo) && Math.abs(Bo.px - s.x) < 34 && s.y > Bo.py - 78 && s.y < Bo.py + 2) { burst(s.x, s.y, 4, '#e0a060', 25); G.sticks.splice(i, 1); damageFinal(s.dmg, 'vul'); continue; }
      if (Bo && Bo.kind === 'trio') {
        var gone = false;
        for (var u = 0; u < Bo.units.length; u++) {
          var un = Bo.units[u];
          if (!unitVuln(un) || s.hit.indexOf(un) >= 0) continue;
          if (Math.abs(un.px - s.x) < 10 && Math.abs(unitCY(un) - s.y) < 12) {
            s.hit.push(un); damageUnit(un, s.dmg, 'vul'); burst(s.x, s.y, 3, '#e0a060', 20);
            if (s.pierce-- <= 0) { G.sticks.splice(i, 1); gone = true; break; }
          }
        }
        if (gone) continue;
      }
      for (var k = 0; k < G.enemies.length; k++) {
        var e = G.enemies[k];
        if (e.state === 'dead' || e.spawnT > 0 || s.hit.indexOf(e) >= 0) continue;
        if (Math.abs(e.px - s.x) < 5 && Math.abs(e.py - 4 - s.y) < 7) {
          s.hit.push(e);
          damageEnemy(e, s.dmg, 'vul');
          burst(s.x, s.y, 3, '#e0a060', 20);
          if (s.pierce-- <= 0) { G.sticks.splice(i, 1); break; }
        }
      }
    }
  }

  // --- グレネーコ゜ッ！ ---
  function useGren(tx, ty) {
    var P = G.player;
    RUN.cd.gren = WP.gren.cd;
    P.face = Math.atan2(ty - P.py, tx - P.px);
    G.grens.push({ x0: P.px, y0: P.py - 8, x1: tx, y1: ty, t: 0, dur: 0.5 });
    popup(P.px, P.py - 20, 'グレネーコ゜ッ！', 'gold');
  }
  function updGrens(dt) {
    for (var i = G.grens.length - 1; i >= 0; i--) {
      var g = G.grens[i]; g.t += dt;
      if (g.t < g.dur) continue;
      G.grens.splice(i, 1);
      var parts = [];
      for (var k = 0, np = Math.round(18 * WP.gren.rad * WP.gren.rad); k < np; k++) parts.push({ a: rnd() * Math.PI * 2, r: Math.sqrt(rnd()), s: (rnd() < 0.5 ? -1 : 1) * (0.3 + rnd() * 0.6), z: rnd() < 0.4 ? 3 : 2 });
      G.gas.push({ x: g.x1, y: g.y1, r: WP.gren.rad * T, t: WP.gren.dur, dur: WP.gren.dur, dps: WP.gren.dps * atkMult(), parts: parts });
      sfx('gas');
      burst(g.x1, g.y1, 10, '#f2e04e', 30);
    }
    for (var j = G.gas.length - 1; j >= 0; j--) {
      var c = G.gas[j]; c.t -= dt;
      if (c.t <= 0) { G.gas.splice(j, 1); continue; }
      for (var q = 0; q < G.enemies.length; q++) {
        var e = G.enemies[q];
        if (e.state === 'dead' || e.spawnT > 0) continue;
        if (Math.hypot(e.px - c.x, e.py - c.y) <= c.r) damageEnemy(e, c.dps * dt, 'gas');
      }
      if (G.boss && G.boss.kind === 'trio') G.boss.units.forEach(function (un) { if (unitVuln(un) && Math.hypot(un.px - c.x, un.py - c.y) <= c.r) damageUnit(un, c.dps * dt, 'gas'); });
      if (G.boss && G.boss.kind === 'final') { if (finalVuln(G.boss) && Math.hypot(G.boss.px - c.x, G.boss.py - 20 - c.y) <= c.r + 30) damageFinal(c.dps * dt, 'gas'); }
      else if (G.boss && bossVulnerable(G.boss) && Math.hypot(G.boss.px - c.x, G.boss.py - c.y) <= c.r) { if (G.boss.kind === 'julia') damageJulia(c.dps * dt, 'gas'); else bossHit(); }
    }
  }

  // --- 野獣モード（ボタンで発動） ---
  function activateYaju() {
    var P = G && G.player;
    if (!WP || !WP.yaj.on || RUN.cd.yaj > 0 || !P || G.phase !== 'play' || P.mode === 'dead' || P.mode === 'clear' || P.yajT > 0) return;
    P.yajT = WP.yaj.dur; P.shield = WP.yaj.shield; RUN.cd.yaj = WP.yaj.cd;
    banner('野獣モード', 'red');
    popup(P.px, P.py - 20, 'ｳｵｵｵｯ!!', 'red big');
    log('野獣モード発動');
    burst(P.px, P.py - 4, 16, '#ff5a5a', 40);
  }

  // --- 毎フレーム：再使用時間・効果時間・自動使用 ---
  function updWeapons(dt) {
    var P = G.player, rate = P.yajT > 0 ? WP.yaj.cdRate : 1;
    RUN.cd.vul = Math.max(0, RUN.cd.vul - dt * rate);
    RUN.cd.gren = Math.max(0, RUN.cd.gren - dt * rate);
    if (P.hyoT <= 0) RUN.cd.hyo = Math.max(0, RUN.cd.hyo - dt * rate);   // 効果が終わってから数え始める
    if (P.yajT <= 0) RUN.cd.yaj = Math.max(0, RUN.cd.yaj - dt);          // 効果が終わってから数え始める
    if (P.hyoT > 0) { P.hyoT -= dt; if (P.hyoT <= 0) { P.hyoT = 0; log('ヒョウモンステルス終了'); } }
    if (P.yajT > 0) { P.yajT -= dt; if (P.yajT <= 0) { P.yajT = 0; P.shield = 0; log('野獣モード終了'); } }

    // シャワーも浴びずに：ステルス中、近くの敵にダメージ
    if (P.hyoT > 0 && WP.hyo.shower) {
      for (var q = 0; q < G.enemies.length; q++) {
        var e = G.enemies[q];
        if (e.state === 'dead' || e.spawnT > 0) continue;
        if (Math.hypot(e.px - P.px, e.py - P.py) <= 1.4 * T) damageEnemy(e, WP.hyo.aura * atkMult() * dt, 'aura');
      }
      if (G.boss && G.boss.kind === 'julia' && juliaVuln(G.boss) && Math.hypot(G.boss.px - P.px, G.boss.py - P.py) <= 1.4 * T) damageJulia(WP.hyo.aura * atkMult() * dt, 'aura');
      if (rnd() < dt * 12) G.sparks.push({ x: P.px + (rnd() - 0.5) * 14, y: P.py - rnd() * 12, vx: 0, vy: -12, t: 0.5, c: '#9acd32' });
    }
    if (P.yajT > 0 && rnd() < dt * 14) G.sparks.push({ x: P.px + (rnd() - 0.5) * 10, y: P.py - 6 - rnd() * 8, vx: 0, vy: -18, t: 0.4, c: rnd() < 0.5 ? '#ff5a5a' : '#ffd0d0' });

    // 連射中のカルパス
    if (P.vol) {
      P.vol.t -= dt;
      if (P.vol.t <= 0) {
        var tg = P.vol.tgt;
        if (tg && tg.unit) { if (!unitVuln(tg)) tg = null; }
        else if (tg && tg === G.boss) { if (!bossVulnerable(tg)) tg = null; }
        else if (!tg || !usable(tg) || !canShoot(P, tg)) tg = G.bossMode ? null : pickVulTarget(true);
        if (tg) { fireSticks(P, tg); P.vol.tgt = tg; }
        P.vol.n--; P.vol.t = 0.14;
        if (P.vol.n <= 0 || !tg) P.vol = null;
      }
    }
    if (P.mode !== 'move' || G.phase !== 'play') return;
    if (G.bossMode) { if (P.hiddenT <= 0 && !P.captured) bossWeapons(P); return; }

    // ヒョウモンステルス：足止めされている／強行突破するとき、アラート中に危ないとき
    if (WP.hyo.on && RUN.cd.hyo <= 0 && P.hyoT <= 0) {
      var need;
      if (G.alert) {
        var seeing = G.enemies.filter(function (o) { return o.state === 'alert' && o.saw; }).length;
        need = P.hp <= P.maxHp * 0.5 || seeing >= 2;
      } else need = P.blocked || P.rush > 0;
      if (need) {
        P.hyoT = WP.hyo.dur; RUN.cd.hyo = WP.hyo.cd;
        popup(P.px, P.py - 20, 'ヒョウモンステルス！', 'gold');
        log('ヒョウモンステルス発動');
      }
    }
    // カルパスバルカン
    if (WP.vul.on && RUN.cd.vul <= 0 && !P.vol) {
      var t = pickVulTarget(false);
      if (t) useVul(t);
    }
    // グレネーコ゜ッ！：一番多く巻き込める相手へ
    if (WP.gren.on && RUN.cd.gren <= 0) {
      var best = null, bc = 0;
      G.enemies.forEach(function (e) {
        if (!usable(e)) return;
        if (!G.alert && !e.sensed) return;
        var d = Math.hypot(e.px - P.px, e.py - P.py) / T;
        if (d > WP.gren.range || d < 1) return;
        if (!los(P.px / T, P.py / T, e.px / T, e.py / T)) return;
        var n = 0;
        G.enemies.forEach(function (o) { if (o.state !== 'dead' && Math.hypot(o.px - e.px, o.py - e.py) <= WP.gren.rad * T) n++; });
        if (n > bc) { bc = n; best = e; }
      });
      if (best) useGren(best.px, best.py);
    }
  }

  // ===== ボスステージ =====

  var BOSS_STAGES = { 10: 'masahiko', 30: 'julia', 60: 'trio', 80: 'metan', 100: 'final' };
  var BOSS_SPEED_CAP = 1.6;      // STAGE 10：足場が悪く、プレイヤーはこれより速く動けない

  var BOSS_THEME = { name: 'ボス戦', floor: 'concrete', fA: '#2b3836', fB: '#33433f', fL: '#1a2422', fH: '#3f524c',

  // マップ：外周はすべて水、中央にも大きな池。水（値4）は歩けないが見通せる
  function generateBoss1() {
    var g = new Uint8Array(N), x, y;
    for (y = 0; y < MH; y++) for (x = 0; x < MW; x++) {
      var edge = x === 0 || y === 0 || x === MW - 1 || y === MH - 1;
      var pool = x >= 9 && x <= 16 && y >= 4 && y <= 8;
      g[y * MW + x] = edge || pool ? 4 : 0;
    }
    [[4, 6], [21, 6]].forEach(function (p) { g[p[1] * MW + p[0]] = 2; });   // 岸辺の木箱
    var sx = 13, sy = MH - 2;
    bfs(g, sy * MW + sx);
    return { g: g, objs: [], sx: sx, sy: sy, gx: -1, gy: -1, reach: Int16Array.from(BD) };
  }

  function makeBoss1() {
    var x = 13, y = 2;
    return { kind: 'masahiko', name: '水没紳士 マサヒコ', hp: 3, maxHp: 3,
      px: (x + 0.5) * T, py: (y + 0.5) * T, ang: Math.PI / 2, anim: 0, moving: false,
      state: 'intro', t: 1.4, dur: 1.4, nx: -1, ny: -1, fx: 0, fy: 0, tx: 0, ty: 0,
      hitDone: false, flash: 0, emerge: null, bubbleT: 0 };
  }
  function bossVulnerable(B) { if (B && (B.kind === 'trio' || B.kind === 'metan')) return false; if (B && B.kind === 'final') return finalVuln(B); if (B && B.kind === 'julia') return juliaVuln(B); return !!B && (B.state === 'intro' || B.state === 'walk' || B.state === 'attack' || B.state === 'hold'); }
  function bossTile(B) { return Math.floor(B.py / T) * MW + Math.floor(B.px / T); }
  function isWater(i) { return grid[i] === 4; }
  // いちばん近い水のマス
  function nearestWater(px0, py0) {
    var best = -1, bd = Infinity;
    for (var i = 0; i < N; i++) {
      if (!isWater(i)) continue;
      var d = Math.hypot(((i % MW) + 0.5) * T - px0, (((i / MW) | 0) + 0.5) * T - py0);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  // 水に飛び込む／水から飛び出す（from → to を放物線で移動）
  function bossJump(B, state, toX, toY, dur) {
    B.state = state; B.t = dur; B.dur = dur;
    B.fx = B.px; B.fy = B.py; B.tx = toX; B.ty = toY;
    B.ang = Math.atan2(toY - B.py, toX - B.px);
  }
  function bossDive(B) {
    var w = nearestWater(B.px, B.py);

  }
  // 飛び出す場所：水に面した岸で、プレイヤーから少し離れたところ
  function pickEmerge() {
    var P = G.player, c1 = [], c2 = [];
    for (var i = 0; i < N; i++) {
      if (grid[i] !== 0) continue;
      var x = i % MW, y = (i / MW) | 0, w = -1;
      for (var k = 0; k < 4; k++) { var j = (y + DY[k]) * MW + x + DX[k]; if (isWater(j)) { w = j; break; } }
      if (w < 0) continue;
      var d = Math.hypot((x + 0.5) * T - P.px, (y + 0.5) * T - P.py) / T;
      if (d >= 3 && d <= 5.5) c1.push([i, w]); else if (d >= 2.5) c2.push([i, w]);
    }
    var c = c1.length ? c1 : c2;
    return c[Math.floor(rnd() * c.length)];
  }

  // ボスにダメージ（1回の攻撃で1だけ。受けたらすぐ無敵になって水へ逃げる）

    if (!bossVulnerable(B)) return;
    B.hp -= 1; B.flash = 0.25;
    sfx('boss_hit');
    popup(B.px, B.py - 34, '−1', 'red big');
    burst(B.px, B.py - 12, 10, '#ffffff', 35);
    if (P.stunT > 0) { P.stunT = 0; popup(P.px, P.py - 18, '振りほどいた！', 'cyan'); }
    if (B.hp <= 0) {

      banner('BOSS撃破', 'gold');
      log(B.name + 'を撃破');
      return;
    }
    log(B.name + 'に命中（残り ' + B.hp + '）');
    bossDive(B);
  }

  function updBoss1(dt) {
    var B = G.boss, P = G.player;
    if (!B || B.state === 'gone') return;
    if (B.flash > 0) B.flash -= dt;
    B.t -= dt;
    var f;
    switch (B.state) {
      case 'intro':
        B.ang = Math.PI / 2;
        if (B.t <= 0) { popup(B.px, B.py - 44, 'タクヤ、楽しもうな！', 'gold big'); bossDive(B); }
        break;
      case 'dive':
      case 'emerge':
        f = 1 - Math.max(0, B.t) / B.dur;
        B.px = B.fx + (B.tx - B.fx) * f; B.py = B.fy + (B.ty - B.fy) * f;
        if (B.t <= 0) {
          if (B.state === 'dive') {
            burst(B.tx, B.ty, 14, '#9fd8e8', 40);
            B.state = 'under'; B.t = 2.5 + rnd() * 1.5; B.emerge = null;
          } else {
            burst(B.fx, B.fy, 14, '#9fd8e8', 40);
            B.state = 'walk'; B.nx = -1; B.moving = false;
          }
        }
        break;
      case 'under':
        if (B.t <= 0.9 && !B.emerge) B.emerge = pickEmerge();       // 飛び出す直前に水面が揺れる

          B.px = ((Wt % MW) + 0.5) * T; B.py = (((Wt / MW) | 0) + 0.5) * T;
          bossJump(B, 'emerge', ((L % MW) + 0.5) * T, (((L / MW) | 0) + 0.5) * T, 0.6);
        } else if (B.t <= 0) B.t = 0.3;
        break;
      case 'walk': {
        var hidden = P.hiddenT > 0 || P.mode === 'dead';
        var dist = Math.hypot(P.px - B.px, P.py - B.py);
        if (!hidden && !P.captured && dist <= 1.3 * T) {
          B.state = 'attack'; B.t = 0.6; B.dur = 0.6; B.hitDone = false; B.moving = false;
          B.ang = Math.atan2(P.py - B.py, P.px - B.px);
          break;
        }
        // 岸を歩いてプレイヤーへ（BFSでたどる）
        if (B.nx < 0 || Math.hypot(B.nx - B.px, B.ny - B.py) < 0.8) {

            for (var k = 0; k < 4; k++) {
              var nx = bt % MW + DX[k], ny = ((bt / MW) | 0) + DY[k];
              if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
              var n = ny * MW + nx;
              if (BD[n] >= 0 && BD[n] < bdv) { bdv = BD[n]; best = n; }
            }
            if (best >= 0) { B.nx = (best % MW + 0.5) * T; B.ny = (((best / MW) | 0) + 0.5) * T; }
            else { B.nx = P.px; B.ny = P.py; }
          }
        }
        var dx = B.nx - B.px, dy = B.ny - B.py, dl = Math.hypot(dx, dy), sp = BOSS1_SPEED * T * dt;
        if (dl > 0.01) {
          var mv = Math.min(sp, dl);
          B.px += dx / dl * mv; B.py += dy / dl * mv;
          B.ang = Math.atan2(dy, dx); B.moving = true; B.anim += dt * BOSS1_SPEED * 2;

        if (!B.hitDone && B.t <= B.dur * 0.5) {

          if (Math.hypot(P.px - B.px, P.py - B.py) <= 1.8 * T && P.hiddenT <= 0 && P.mode === 'move') {
            P.stunT = 4;
            G.hits.push({ x: (P.px + B.px) / 2, y: (P.py + B.py) / 2 - 8, t: 0.2 });
            popup(P.px, P.py - 18, '動けない！', 'red');
          }
        }
        if (B.t <= 0) {
          if (P.stunT > 0) { B.state = 'hold'; B.t = 1.2; B.dur = 1.2; popup(B.px, B.py - 44, 'それじゃあ行くぞ！', 'gold big'); }
          else { B.state = 'walk'; B.nx = -1; }
        }
        break;
      case 'hold':
        if (P.stunT <= 0) { B.state = 'walk'; B.nx = -1; break; }        // 振りほどかれた

  // 初期位置へ戻す（引きずり込まれて生き残ったとき）
  function respawnAtStart(P) {
    P.x = P.fx = P.tx = G.sx; P.y = P.fy = P.ty = G.sy;
    P.px = (G.sx + 0.5) * T; P.py = (G.sy + 0.5) * T;
    P.moving = false; P.mt = 1; P.captured = false; P.stunT = 0; P.thinkT = 0.3;

  }

  // --- ボス戦中だけのプレイヤーの動き ---
  // 全域を把握。武装が使えれば近づいて攻撃、使えなければ逃げる。ボスが潜っている間は岸を気まぐれに周回
  function bossThink1(P, pt) {
    var B = G.boss;
    P.waiting = false;
    dijkstra(pt, function (v) { return grid[v] !== 0 ? Infinity : 1; });
    var target = -1;
    if (bossVulnerable(B)) {
      var vulReady = WP.vul.on && RUN.cd.vul <= 0, grenReady = WP.gren.on && RUN.cd.gren <= 0;
      if (vulReady || grenReady) {
        var range = Math.max(vulReady ? WP.vul.range : 0, grenReady ? WP.gren.range : 0) * 0.85;
        var d = Math.hypot(B.px - P.px, B.py - P.py) / T;
        if (d <= range && los(P.px / T, P.py / T, B.px / T, B.py / T)) { P.thinkT = 0.1; P.waiting = true; return; }
        target = bossTile(B);
      } else {
        // ボスから遠ざかる方へ一歩ずつ
        bfs(grid, bossTile(B));
        var best = -1, bd = BD[pt];
        for (var k = 0; k < 4; k++) {
          var nx = P.x + DX[k], ny = P.y + DY[k];
          if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
          var n = ny * MW + nx;
          if (grid[n] === 0 && BD[n] > bd) { bd = BD[n]; best = n; }
        }
        if (best >= 0) { movePlayer(P, best); return; }
        P.thinkT = 0.15; P.waiting = true; return;
      }
    } else {
      if (P.wander === undefined || P.wander < 0 || P.wander === pt || DIST[P.wander] === Infinity) {
        var cands = [];
        for (var i = 0; i < N; i++) if (grid[i] === 0 && DIST[i] >= 5 && DIST[i] < Infinity) cands.push(i);
        P.wander = cands.length ? cands[Math.floor(rnd() * cands.length)] : -1;
      }
      target = P.wander;
    }
    var step = firstStep(pt, target);
    if (step < 0) { P.thinkT = 0.15; P.waiting = true; P.wander = -1; return; }
    movePlayer(P, step);
  }
  // ボス戦中の武装：効くのはカルパスバルカンとグレネーコ゜ッ！だけ
  function bossWeapons1(P) {
    var B = G.boss;
    if (!bossVulnerable(B)) return;
    var d = Math.hypot(B.px - P.px, B.py - P.py) / T;
    var sight = los(P.px / T, P.py / T, B.px / T, B.py / T);
    if (WP.vul.on && RUN.cd.vul <= 0 && !P.vol && d <= WP.vul.range && (sight || WP.vul.wall)) useVul(B);
    if (WP.gren.on && RUN.cd.gren <= 0 && d <= WP.gren.range) useGren(B.px, B.py);
  }

  // --- 描画 ---
  function bossFrame(B) {
    var o = dirOf(B.ang), d = o.d, key;
    switch (B.state) {
      case 'attack': key = d + '_attack_' + (B.t > B.dur * 0.5 ? 0 : 1); break;
      case 'hold': key = d + '_attack_1'; break;
      case 'drag': key = 'jump_1'; o.flip = false; break;
      case 'dive': case 'emerge': {
        var f = 1 - Math.max(0, B.t) / B.dur;
        if (B.state === 'emerge') f = 1 - f;
        key = f < 0.4 ? 'jump_0' : f < 0.75 ? 'jump_1' : 'jump_2'; o.flip = false; break;
      }
      case 'defeat': key = 'defeat_' + (Math.floor(animT * 4) % 2); o.flip = false; break;
      default: key = d + '_' + (B.moving ? Math.floor(B.anim) % 4 : 0);
    }
    return { rows: BOSS1_FRAMES['boss1_' + key], flip: o.flip };
  }
  function drawBoss1() {
    var B = G.boss, c = ctx;
    if (!B || B.state === 'under' || B.state === 'gone') return;
    var fr = bossFrame(B), lift = 0, alpha = 1;
    if (B.state === 'dive' || B.state === 'emerge' || B.state === 'drag') {
      var f = 1 - Math.max(0, B.t) / B.dur;
      lift = Math.sin(Math.PI * f) * 12;
      var sink = B.state === 'emerge' ? 1 - f : f;
      alpha = sink > 0.7 ? Math.max(0, (1 - sink) / 0.3) : 1;
    }
    var X = Math.round(B.px) - 12, Y = Math.round(B.py) + 5 - 32 - Math.round(lift);
    c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(Math.round(B.px) - 8, Math.round(B.py) + 3, 16, 3);
    c.globalAlpha = alpha;
    spr(c, fr.rows, X, Y, B.flash > 0 && Math.floor(animT * 20) % 2 ? tint(BOSS1_PALETTE, '#ffffff') : BOSS1_PALETTE, fr.flip);
    c.globalAlpha = 1;
  }
  // 水面のきらめきと、ボスが飛び出す直前の波紋
  function drawWaterFx(t) {
    var c = ctx;
    for (var i = 0; i < N; i++) {
      if (!isWater(i)) continue;

  // --- 地形：障害物が多く、火炎放射口があちこちに ---
  function generateBoss2() {
    var sx = 13, sy = MH - 2;
    var keep = function (x, y) { return (Math.abs(x - 13) <= 3 && y >= 4 && y <= 8) || (y >= MH - 3 && Math.abs(x - sx) <= 2) || (y <= 2 && Math.abs(x - 13) <= 2); };
    for (var attempt = 0; attempt < 300; attempt++) {
      var g = new Uint8Array(N), x, y, k, i;
      for (y = 0; y < MH; y++) for (x = 0; x < MW; x++) if (x === 0 || y === 0 || x === MW - 1 || y === MH - 1) g[y * MW + x] = 1;
      var nObs = 20 + ri(0, 5);
      for (k = 0; k < nObs; k++) {
        var w = ri(1, 2), h = ri(1, 2), bx = ri(1, MW - 1 - w), by = ri(1, MH - 1 - h), ok = true;
        for (y = by; y < by + h && ok; y++) for (x = bx; x < bx + w && ok; x++) if (g[y * MW + x] !== 0 || keep(x, y)) ok = false;
        if (!ok) continue;
        var v = rnd() < 0.55 ? 2 : 1;
        for (y = by; y < by + h; y++) for (x = bx; x < bx + w; x++) g[y * MW + x] = v;
      }
      bfs(g, sy * MW + sx);
      var floorN = 0, reachN = 0;
      for (i = 0; i < N; i++) if (g[i] === 0) { floorN++; if (BD[i] >= 0) reachN++; }
      if (reachN < floorN * 0.85) continue;
      for (i = 0; i < N; i++) if (g[i] === 0 && BD[i] < 0) g[i] = 1;
      var reach = Int16Array.from(BD);
      // 火炎放射口：床の上の噴出口から、3マスの炎が伸びる
      var cand = [];
      for (i = 0; i < N; i++) {
        if (g[i] !== 0) continue;
        x = i % MW; y = (i / MW) | 0;
        if (keep(x, y) || Math.hypot(x - sx, y - sy) < 4) continue;
        for (k = 0; k < 4; k++) {
          var tiles = [], good = true;
          for (var s = 1; s <= 3; s++) {
            var tx = x + DX[k] * s, ty = y + DY[k] * s;
            if (tx < 1 || ty < 1 || tx >= MW - 1 || ty >= MH - 1 || g[ty * MW + tx] !== 0 || Math.hypot(tx - sx, ty - sy) < 3) { good = false; break; }
            tiles.push(ty * MW + tx);
          }
          // 噴出口の後ろが壁か障害物（壁から火が出ているように見せる）
          var bxk = x - DX[k], byk = y - DY[k];
          if (good && g[byk * MW + bxk] !== 0) cand.push({ x: x, y: y, k: k, tiles: tiles });
        }
      }

      var vents = [], used = new Uint8Array(N);
      for (var c = 0; c < cand.length && vents.length < 9; c++) {
        var cv = cand[c], clash = used[cv.y * MW + cv.x];
        cv.tiles.forEach(function (t) { if (used[t]) clash = 1; });
        if (clash) continue;
        used[cv.y * MW + cv.x] = 1; cv.tiles.forEach(function (t) { used[t] = 1; });
        cv.period = 3.4 + rnd() * 1.2; cv.onDur = 1.3 + rnd() * 0.4; cv.phase = rnd() * 5;
        vents.push(cv);
      }
      if (vents.length < 6) continue;
      return { g: g, objs: [], sx: sx, sy: sy, gx: -1, gy: -1, reach: reach, vents: vents };
    }

  }
  function placeHealItems(m) {
    var cand = [];
    for (var i = 0; i < N; i++) {
      if (m.g[i] !== 0 || m.reach[i] < 0) continue;
      var x = i % MW, y = (i / MW) | 0;
      if (Math.hypot(x - m.sx, y - m.sy) < 3 || G.flameTile[i]) continue;
      cand.push(i);
    }
    shuffle(cand);
    var picked = [];
    for (var c = 0; c < cand.length && picked.length < 4; c++) {
      var ci = cand[c];
      if (picked.every(function (p) { return Math.hypot(p % MW - ci % MW, ((p / MW) | 0) - ((ci / MW) | 0)) >= 6; })) picked.push(ci);
    }

  }

  function makeJulia() {
    return { kind: 'julia', name: 'ジュリア', hp: 24, maxHp: 24, third: 8, phase: 0, cap: JULIA_CAP,
      px: CX, py: 1.5 * T, ang: Math.PI / 2, anim: 0, moving: false,
      state: 'intro', t: 1.0, dur: 1.0, fx: 0, fy: 0, tx: 0, ty: 0, flash: 0,
      cone: [], coneMap: new Uint8Array(N), spotted: false, lastX: 0, lastY: 0, unseenT: 0,
      shootCd: 0.6, fireAnim: 0, meteorT: 0, target: -1, retargetT: 0, nx: -1, ny: -1, pause: 0, look: 0,

  }
  function juliaVuln(J) { return !!J && (J.state === 'search' || J.state === 'chase' || J.state === 'shoot'); }

  // ダメージ：着地してから全体力の3分の1までしか通らない。受けきったら再び宙へ
  function damageJulia(dmg, src) {
    var J = G.boss, P = G.player;
    if (!juliaVuln(J)) return;
    var floor = J.maxHp - J.third * (J.phase + 1);
    J.hp = Math.max(floor, J.hp - dmg);
    if (src !== 'gas' && src !== 'aura') sfx('boss_hit');
    J.flash = Math.max(J.flash, src === 'gas' || src === 'aura' ? 0.05 : 0.15);
    if (src === 'slap') popup(J.px, J.py - 36, 'ビンタ！', 'gold big');
    if (src !== 'gas' && src !== 'aura' && P.hyoT <= 0) { J.spotted = true; J.lastX = P.px; J.lastY = P.py; J.unseenT = 0; }
    if (J.hp <= floor + 1e-6) {
      J.hp = floor; J.phase++;
      J.spotted = false; J.moving = false;
      if (J.phase >= 3) {
        J.hp = 0; J.state = 'fall'; J.t = 0.9; J.dur = 0.9;
        log('ジュリアの体力がゼロに');
      } else {
        log('ジュリアが再び宙へ（残り ' + Math.round(J.hp) + '）');

  }
  function juliaFly(J, state, toX, toY, dur) {
    J.state = state; J.t = dur; J.dur = dur;

  }
  function juliaRise(J) { juliaFly(J, 'rise', CX, CY, 1.2); }

  // 炎：点いている(2)／もうすぐ点く(1)
  function updFlames() {
    var f = G.flame; f.fill(0);
    G.vents.forEach(function (v) {
      var ph = (G.time + v.phase) % v.period, st = ph < v.onDur ? 2 : ph > v.period - 0.6 ? 1 : 0;
      if (st === 2 && v.st !== 2) sfx('flame');         // 火柱が上がった
      v.st = st;
      if (st) v.tiles.forEach(function (t) { f[t] = Math.max(f[t], st); });
    });
  }
  function juliaFire(J, P) {
    var a = Math.atan2(P.py - 4 - (J.py - 14), P.px - J.px), sp = 95;
    G.jfire.push({ x: J.px + Math.cos(a) * 8, y: J.py - 14 + Math.sin(a) * 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 3 });
    J.fireAnim = 0.3;
    sfx('fireball');
  }
  // 歩いて目標のマスへ（BFSでたどる）
  function juliaWalk(J, goal, speed, dt) {
    if (goal < 0) { J.moving = false; return; }
    if (J.nx < 0 || Math.hypot(J.nx - J.px, J.ny - J.py) < 0.8) {
      var bt = bossTile(J);
      bfs(grid, goal);
      var best = -1, bdv = BD[bt] < 0 ? 999 : BD[bt];
      for (var k = 0; k < 4; k++) {
        var nx = bt % MW + DX[k], ny = ((bt / MW) | 0) + DY[k];
        if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
        var n = ny * MW + nx;
        if (BD[n] >= 0 && BD[n] < bdv) { bdv = BD[n]; best = n; }
      }
      if (best < 0) { J.moving = false; J.nx = -1; return; }
      J.nx = (best % MW + 0.5) * T; J.ny = (((best / MW) | 0) + 0.5) * T;
    }
    var dx = J.nx - J.px, dy = J.ny - J.py, dl = Math.hypot(dx, dy);
    if (dl < 0.01) { J.moving = false; return; }
    var mv = Math.min(speed * T * dt, dl);
    J.px += dx / dl * mv; J.py += dy / dl * mv;
    J.ang = Math.atan2(dy, dx); J.moving = true; J.anim += dt * speed * 2;
  }

  function updJulia(dt) {
    var J = G.boss, P = G.player, f, i;
    updFlames();
    if (J.flash > 0) J.flash -= dt;
    if (J.fireAnim > 0) J.fireAnim -= dt;
    if (J.contactCd > 0) J.contactCd -= dt;
    J.t -= dt;
    for (i = 0; i < J.cone.length; i++) J.coneMap[J.cone[i]] = 0;
    J.cone.length = 0;
    var alive = P.mode === 'move';

    switch (J.state) {
      case 'intro':
        J.ang = Math.PI / 2;
        if (J.t <= 0) { popup(J.px, J.py - 40, '熱くなれ！', 'red big'); juliaRise(J); }
        break;
      case 'rise': case 'land':
        f = 1 - Math.max(0, J.t) / J.dur;
        J.px = J.fx + (J.tx - J.fx) * f; J.py = J.fy + (J.ty - J.fy) * f;
        if (J.t <= 0) {
          if (J.state === 'rise') { J.state = 'float'; J.t = 7 + rnd() * 2; J.meteorT = 0.3; }
          else { J.state = 'search'; J.target = -1; J.nx = -1; J.retargetT = 0; }
        }
        break;
      case 'float':
        // 空から火の玉が降ってくる
        J.meteorT -= dt;
        if (J.meteorT <= 0) {
          J.meteorT = 0.45;
          var mx, my;
          if (rnd() < 0.35 && alive) { mx = P.px + (rnd() - 0.5) * 3 * T; my = P.py + (rnd() - 0.5) * 3 * T; }
          else { mx = (1 + rnd() * (MW - 2)) * T; my = (1 + rnd() * (MH - 2)) * T; }
          G.meteors.push({ x: mx, y: my, t: 1.1, dur: 1.1, r: 0.95 * T });
        }
        if (J.t <= 0) {
          // 中央付近の床に降りる（炎の上は避ける）
          var best = -1, bd = Infinity;
          for (i = 0; i < N; i++) {
            if (grid[i] !== 0 || G.flameTile[i]) continue;
            var d = Math.hypot((i % MW + 0.5) * T - CX, (((i / MW) | 0) + 0.5) * T - CY);
            if (d < bd) { bd = d; best = i; }
          }
          juliaFly(J, 'land', (best % MW + 0.5) * T, (((best / MW) | 0) + 0.5) * T, 0.8);
        }
        break;
      case 'search': case 'chase': case 'shoot': {
        // 視界（通常兵より広い）。ヒョウモンステルス中は見つけられない
        if (!J.spotted) scanCone(J, J.ang, 5.5, 0.9, function (t) { J.cone.push(t); J.coneMap[t] = 1; });
        if (!J.spotted && alive && P.hyoT <= 0 && J.coneMap[tileOf(P)]) {
          J.spotted = true; J.unseenT = 0; J.shootCd = 0.5;
          popup(J.px, J.py - 36, '見つけた！', 'red');
          log('ジュリアに発見された');
        }
        if (J.spotted) {
          var dist = Math.hypot(P.px - J.px, P.py - J.py) / T;
          var see = alive && P.hyoT <= 0 && P.hiddenT <= 0 && dist <= 7 && los(J.px / T, J.py / T, P.px / T, P.py / T);
          if (see) {

            J.ang = Math.atan2(P.py - J.py, P.px - J.px);
            J.lastX = P.px; J.lastY = P.py; J.unseenT = 0;
            J.shootCd -= dt;

          } else {
            J.state = 'chase'; J.unseenT += dt;

          }

          var bt = bossTile(J);
          if (J.target < 0 || J.retargetT <= 0 || bt === J.target) {
            if (bt === J.target) { J.pause = 0.6; J.look = 0; }
            var cands = [];
            for (i = 0; i < N; i++) {
              if (grid[i] !== 0) continue;
              if (Math.hypot((i % MW + 0.5) * T - P.px, (((i / MW) | 0) + 0.5) * T - P.py) <= 4 * T) cands.push(i);
            }
            J.target = cands.length ? cands[Math.floor(rnd() * cands.length)] : -1;
            J.retargetT = 3; J.nx = -1;

      }
      case 'fall':

          popup(J.px, J.py - 40, '熱くデカくなれ！', 'red big');

        if (alive && J.contactCd <= 0 && Math.hypot(P.px - J.px, P.py - 6 - (J.py - 10)) <= 1.2 * T) {

        break;
      case 'explode':

  // ビンタ（ジュリアの弱点。大きなダメージ）
  function trySlapJulia(P) {
    var J = G.boss;
    if (!juliaVuln(J) || Math.hypot(J.px - P.px, J.py - P.py) > 1.4 * T) return false;
    P.face = Math.atan2(J.py - P.py, J.px - P.px);
    if (P.punchCd <= 0) {
      P.punchCd = P.yajT > 0 ? 0.3 : 0.45;

      burst((P.px + J.px) / 2, (P.py + J.py) / 2 - 8, 5, '#ffffff', 28);

  // --- STAGE 30だけのプレイヤーの動き ---
  function juliaThink(P, pt) {
    var J = G.boss, i;
    P.waiting = false;
    DANGER.fill(0);
    for (i = 0; i < N; i++) if (G.flame[i]) DANGER[i] += G.flame[i] === 2 ? 10 : 4;
    G.meteors.forEach(function (m) {
      for (var j = 0; j < N; j++) if (Math.hypot((j % MW + 0.5) * T - m.x, (((j / MW) | 0) + 0.5) * T - m.y) <= m.r + 0.4 * T) DANGER[j] += 10;
    });
    var vuln = juliaVuln(J);
    if (vuln && !J.spotted && P.hyoT <= 0) J.cone.forEach(function (t) { DANGER[t] += 3; });
    if (J.state === 'rampage') for (i = 0; i < N; i++) if (Math.hypot((i % MW + 0.5) * T - J.px, (((i / MW) | 0) + 0.5) * T - J.py) <= 2.5 * T) DANGER[i] += 6;
    var jt = vuln ? bossTile(J) : -1;
    dijkstra(pt, function (v) { return grid[v] !== 0 || v === jt ? Infinity : 1 + DANGER[v] * 8; });

    var target = -1;
    // 1. 体力が減ったら回復アイテム
    if (P.hp <= P.maxHp * 0.5) {
      var bc = Infinity;
      G.items.forEach(function (it) { if (!it.taken && DIST[it.i] < bc) { bc = DIST[it.i]; target = it.i; } });
    }
    if (target < 0 && vuln) {
      var gRange = WP.gren.on && RUN.cd.gren <= 0 && P.hyoT <= 0 && !J.spotted;
      var d = Math.hypot(J.px - P.px, J.py - P.py) / T;
      if (gRange && d <= WP.gren.range && d >= 0.8 && los(P.px / T, P.py / T, J.px / T, J.py / T)) { P.thinkT = 0.1; P.waiting = true; return; }
      // 発見されている／ステルス中なら真っすぐ、そうでなければ視界の外から回り込んでビンタを狙う
      var jx = jt % MW, jy = (jt / MW) | 0, bd = Infinity;
      for (var k = 0; k < 4; k++) {
        var nx = jx + DX[k], ny = jy + DY[k];
        if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
        var n = ny * MW + nx;
        if (grid[n] !== 0) continue;
        if (!J.spotted && P.hyoT <= 0 && J.coneMap[n]) continue;
        if (DIST[n] < bd) { bd = DIST[n]; target = n; }
      }
      if (target < 0) target = jt;
    }
    if (target < 0) {
      // 宙に浮いている・暴れている間は、危ない場所を避けて逃げ惑う
      if (DANGER[pt] > 0 || J.state === 'rampage') {
        var bs = Infinity;
        for (i = 0; i < N; i++) {
          if (grid[i] !== 0 || DANGER[i] > 0 || DIST[i] === Infinity) continue;
          var sc = DIST[i] - (J.state === 'rampage' ? Math.hypot((i % MW) * T - J.px, ((i / MW) | 0) * T - J.py) / T : 0);
          if (sc < bs) { bs = sc; target = i; }
        }
      } else {
        if (P.wander < 0 || P.wander === pt || DANGER[P.wander] > 0 || DIST[P.wander] === Infinity) {
          var cands = [];
          for (i = 0; i < N; i++) if (grid[i] === 0 && !DANGER[i] && DIST[i] >= 2 && DIST[i] <= 8) cands.push(i);
          P.wander = cands.length ? cands[Math.floor(rnd() * cands.length)] : -1;
        }
        target = P.wander;
      }
    }
    var step = firstStep(pt, target);
    if (step < 0) { P.thinkT = 0.1; P.waiting = true; P.wander = -1; return; }
    // 燃えている炎には、今いる場所が安全なら踏み込まない
    if (DANGER[step] >= 10 && DANGER[pt] < 10) { P.thinkT = 0.1; P.waiting = true; return; }
    movePlayer(P, step);
  }
  // STAGE 30の武装：カルパスバルカンは使えない。ヒョウモンステルスとグレネーコ゜ッ！を積極的に
  function juliaWeapons(P) {
    var J = G.boss;
    if (!juliaVuln(J)) return;
    if (WP.hyo.on && RUN.cd.hyo <= 0 && P.hyoT <= 0) {
      P.hyoT = WP.hyo.dur; RUN.cd.hyo = WP.hyo.cd;
      if (J.spotted) { J.spotted = false; J.state = 'search'; }
      popup(P.px, P.py - 20, 'ヒョウモンステルス！', 'gold');
      log('ヒョウモンステルス発動');
    }
    var d = Math.hypot(J.px - P.px, J.py - P.py) / T;
    if (WP.gren.on && RUN.cd.gren <= 0 && d <= WP.gren.range && d >= 0.8 && los(P.px / T, P.py / T, J.px / T, J.py / T)) useGren(J.px, J.py);
  }

  // --- 描画 ---
  function juliaFrame(J) {
    var o = dirOf(J.ang), d = o.d, key;
    switch (J.state) {
      case 'intro': key = 'down_0'; break;
      case 'shoot': key = d + '_attack_' + (J.fireAnim > 0 ? 1 : 0); break;
      case 'rise': case 'float': case 'land': key = 'float_' + (Math.floor(animT * 6) % 2); o.flip = false; break;
      case 'fall': key = 'defeat_0'; o.flip = false; break;
      case 'rampage': key = d + '_dash_' + (Math.floor(animT * 10) % 2); break;
      case 'finale': case 'explode': key = 'defeat_1'; o.flip = false; break;
      default: key = d + '_' + (J.moving ? Math.floor(J.anim) % 4 : 0);
    }
    return { rows: BOSS2_FRAMES['boss2_' + key], flip: o.flip };
  }
  function drawJulia() {
    var J = G.boss, c = ctx;
    if (!J || J.state === 'gone') return;
    var fr = juliaFrame(J), lift = 0, f;
    if (J.state === 'rise') { f = 1 - Math.max(0, J.t) / J.dur; lift = f * 12; }
    else if (J.state === 'float') lift = 12 + Math.sin(animT * 3) * 2;
    else if (J.state === 'land') { f = 1 - Math.max(0, J.t) / J.dur; lift = (1 - f) * 12; }
    else if (J.state === 'rampage' || J.state === 'finale' || J.state === 'explode') lift = 6;
    var shake = J.state === 'explode' ? (Math.floor(animT * 30) % 2 ? 1 : -1) : 0;

    c.fillStyle = 'rgba(0,0,0,0.35)';
    c.fillRect(Math.round(J.px) - 7, Math.round(J.py) + 3, 14, 3);

  // 床の上：炎、火の玉の落下地点、ジュリアの視界（キャラより下に描く）
  function drawJuliaFx(t) {
    var c = ctx, J = G.boss;
    G.vents.forEach(function (v) {
      if (v.st === 1 && Math.floor(t * 12) % 2) {
        px(c, v.x * T + 5 + DX[v.k] * 5, v.y * T + 5 + DY[v.k] * 5, 2, 2, '#ffd23c');
      }
      if (v.st !== 2) return;
      v.tiles.forEach(function (ti, n) {
        var X = (ti % MW) * T, Y = ((ti / MW) | 0) * T;
        for (var q = 0; q < 7; q++) {
          var fx = Math.floor(hsh(ti, q, Math.floor(t * 14)) * 10), fy = Math.floor(hsh(q, ti, Math.floor(t * 14) + 3) * 10);
          var col = q < 2 ? '#fff4c0' : q < 4 ? '#ffd23c' : q < 6 ? '#ff7a22' : '#d42c3c';
          c.fillStyle = col; c.fillRect(X + fx, Y + fy, n === 2 ? 2 : 3, n === 2 ? 2 : 3);
        }
      });
    });
    if (juliaVuln(J) && J.cone.length) J.cone.forEach(function (q) { c.drawImage(CONE.sensed, (q % MW) * T, ((q / MW) | 0) * T); });
    G.meteors.forEach(function (m) {
      var f = 1 - m.t / m.dur, r = Math.round(m.r * (0.4 + 0.6 * f));
      c.fillStyle = 'rgba(255,90,40,' + (0.15 + 0.35 * f) + ')';
      for (var a = 0; a < Math.PI * 2; a += 0.3) c.fillRect(Math.round(m.x + Math.cos(a) * r), Math.round(m.y + Math.sin(a) * r * 0.7), 1, 1);
      c.fillStyle = 'rgba(0,0,0,' + (0.2 * f) + ')'; c.fillRect(Math.round(m.x) - 3, Math.round(m.y) - 1, 6, 2);
    });
  }
  // 宙：落ちてくる火の玉と、ジュリアが放つ火の玉（キャラより上に描く）
  function drawJuliaTop() {
    var c = ctx, fr = BOSS2_FIREBALL['boss2_fire_' + (Math.floor(animT * 10) % 2)];
    G.meteors.forEach(function (m) {
      var f = 1 - m.t / m.dur;
      spr(c, fr, Math.round(m.x) - 4, Math.round(m.y - 80 * (1 - f)) - 4, BOSS2_PALETTE);
    });
    G.jfire.forEach(function (b) { spr(c, fr, Math.round(b.x) - 4, Math.round(b.y) - 4, BOSS2_PALETTE); });
  }

      px(c, X, Y + T - 1, T, 1, '#3a2212');                // 幅木
    }
  }
  function drawMazeGate(c) {
    // チクニーザウルスの家の扉（木の両開き）
    var X = 12 * T + 1, Y = 4 * T + 1, w = 2 * T - 2, h = T - 1;
    px(c, X, Y, w, h, '#3a2212');
    px(c, X + 1, Y + 1, w - 2, h - 1, '#8a5a30');
    px(c, X + w / 2 - 0.5 | 0, Y + 1, 1, h - 1, '#3a2212');
    px(c, X + 3, Y + 3, 6, 5, '#74482a'); px(c, X + w - 9, Y + 3, 6, 5, '#74482a');
    px(c, X + w / 2 - 3 | 0, Y + 6, 1, 1, '#f0c850'); px(c, X + w / 2 + 2 | 0, Y + 6, 1, 1, '#f0c850');
    px(c, X + 1, Y + 1, w - 2, 1, '#a8744a');
  }

  // HUD：3体の体力
  var trioBarKey = '';
  function trioBar() {
    var B = G.boss, segs = 6;
    var part = function (label, u) {
      var n = unitDead(u) ? 0 : Math.max(0, Math.ceil(u.hp / u.maxHp * segs - 1e-6));
      var col = u.state === 'house' || u.state === 'exit' ? '#8a8a9a' : '';
      return label + '<span class="red"' + (col ? ' style="color:' + col + '"' : '') + '>' + new Array(n + 1).join('■') + new Array(segs - n + 1).join('□') + '</span>';
    };
    var s = part('母ウニ', B.uni) + '　' + part('ホモイルカ', B.iruka) + '　' + part('チクニー', B.chiku);
    if (s !== trioBarKey) { trioBarKey = s; $('bossName').innerHTML = s; $('bossName')._t = null; }
  }

  }

          break;
        case 'iruka':      // ホモイルカの突撃：上から一直線に突っ込み、画面の外へ
          if (a.phase === 'warn') { if (a.t <= 0) { a.phase = 'go'; a.y = cam - 24; a.hit = false; } break; }
          a.y += 14 * T * dt;
          if (rnd() < dt * 30) G.sparks.push({ x: a.x + (rnd() - 0.5) * 8, y: a.y - 16, vx: 0, vy: -30, t: 0.3, c: '#e2e8f0' });

          if (a.y > vBot + 40) dead = true;
          break;
        case 'vul':        // カルパスバルカン：狙った線に沿って連射（壁を貫通）
          if (a.phase === 'warn') { if (a.t <= 0) { a.phase = 'go'; a.fireT = 0; } break; }
          a.fireT -= dt;
          if (a.n > 0 && a.fireT <= 0) {
            a.n--; a.fireT = 0.09;

          }
          if (a.n <= 0) dead = true;
          break;
        case 'gren':       // グレネーコ゜ッ！：着弾すると毒ガス（プレイヤーにも効く）

  }

        case 'needle':

    B.gas.forEach(function (g) { sMarkCircle(g.x, g.y, g.r); });
  }

  // --- STAGE 80だけのプレイヤーの動き：危ない場所を避けながら上へ。攻撃はしない ---
  function metanThink(P, pt) {
    var B = G.boss, i, target = -1, best = Infinity, step;
    P.waiting = false;
    if (B.state !== 'run') { P.thinkT = 0.1; P.waiting = true; return; }
    metanDanger();
    sDijkstra(pt, function (v) { return grid[v] !== 0 ? Infinity : 1 + SDANGER[v] * 8; });
    if (SDANGER[pt] > 0) {
      // 危ない場所にいたら、いちばん近い安全なマスへ（少しでも上を選ぶ）
      for (i = 0; i < SN; i++) {
        if (grid[i] !== 0 || SDANGER[i] > 0 || SDIST[i] === Infinity) continue;
        var sc = SDIST[i] + ((i / MW) | 0) * 0.25;
        if (sc < best) { best = sc; target = i; }
      }
      step = sFirstStep(pt, target);
      if (step >= 0) { movePlayer(P, step); return; }
      P.thinkT = 0.1; P.waiting = true; return;
    }
    for (var x = 1; x < MW - 1; x++) { i = MW + x; if (SDIST[i] < best) { best = SDIST[i]; target = i; } }
    step = sFirstStep(pt, target);
    if (step < 0 || SDANGER[step] > 0) { P.thinkT = 0.1; P.waiting = true; return; }
    movePlayer(P, step);
  }

        im.onload = function () { if (--left === 0 && !failed) { portOK = true; portEl.hidden = false; } };

        var p = portPathRaw(ci, st);

      });
    });
  })();

    var src = portPath(save.charIdx, st);

  var speedMul = 1, last = 0;
  function frame(ts) {
    if (last && ts - last < 10) { requestAnimationFrame(frame); return; }   // 120Hz などの画面では1回おきに（電池・発熱を抑える）
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
    last = ts; animT += dt;
    bgmTick();
    if (TALK || ENDING || OPV) {                     // 会話・OP・ED の間はゲームを止める
      var covered = (OPV && OPV.out < 0) || (ENDING && ED && ED.out < 0);   // 真っ黒な画面で覆われている間は、下のゲーム画面を描かない
      if (!covered) render();
      if (TALK) updTalk(); if (ENDING) updEnding(); if (OPV) updOp();
      requestAnimationFrame(frame); return;
    }
    var total = dt * speedMul;
    while (total > 1e-6) { var s = Math.min(1 / 60, total); step(s); total -= s; }
    auWatch();
    if (!(CUT && CUT.k >= 0)) render();              // カットシーンの一枚絵が出ている間は、下のゲーム画面を描かない
    if (!TALK) hud();
    requestAnimationFrame(frame);
  }

  // ===== レイアウト（横画面固定・左右の枠） =====
  function layout() {
    var SW = stageEl.clientWidth, SH = stageEl.clientHeight;
    if (!SW || !SH) return;
    var portrait = SH > SW;
    var W = portrait ? SH : SW, H = portrait ? SW : SH;
    view.style.width = W + 'px';
    view.style.height = H + 'px';
    var dpr = window.devicePixelRatio || 1;
    var s = H * dpr / GH;
    var gwAvail = W * dpr / s;
    side = 0;
    if (gwAvail < CW) s = W * dpr / CW;
    else side = Math.max(0, Math.min(75, Math.floor((gwAvail - CW) / 2)));
    gw = CW + 2 * side;
    var u = s / dpr;
    canvas.width = gw; canvas.height = GH;
    canvas.style.width = (gw * u) + 'px';
    canvas.style.height = (GH * u) + 'px';
    board.style.width = (gw * u) + 'px';
    board.style.height = (GH * u) + 'px';
    board.style.setProperty('--u', u + 'px');
    board.style.setProperty('--side', side);
    document.body.dataset.portrait = portrait ? 'on' : 'off';
    document.body.dataset.frames = side >= 32 ? 'on' : 'off';

  }

    try { if (on) localStorage.setItem(DEV_KEY, '1'); else localStorage.removeItem(DEV_KEY); } catch (e) {}
  }
  try { devSet(localStorage.getItem(DEV_KEY) === '1'); } catch (e) { devSet(false); }
  el.wTitle.addEventListener('pointerdown', function () {
    var now = performance.now();
    devTap.n = now - devTap.t < 1000 ? devTap.n + 1 : 1;   // 1秒以内に続けて押した回数
    devTap.t = now;
    if (devTap.n < 15) return;
    devTap.n = 0;
    var on = $('devRow').hidden;
    devSet(on);
    sfx(on ? 'ui_unlock' : 'ui_tap');
    showNote(on ? '「設定」にテスト用ボタンを表示しました。' : 'テスト用ボタンを隠しました。');
    syncUI(true);
  });
  var SPEEDS = [1, 2, 4];
  el.speed.addEventListener('click', function () {
    speedMul = SPEEDS[(SPEEDS.indexOf(speedMul) + 1) % SPEEDS.length];
    el.speed.textContent = '速度 ×' + speedMul;
  });
  function jump(d) {
    save.stage = clamp(G.stage + d, 1, LAST);
    writeSave();
    G.bullets.length = 0;
    G.phase = 'jump';
    enterStage();
  }
  $('sm10').addEventListener('click', function () { jump(-10); });
  $('sm1').addEventListener('click', function () { jump(-1); });
  $('sp1').addEventListener('click', function () { jump(1); });
  $('sp10').addEventListener('click', function () { jump(10); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ui]'), function (b) { b.addEventListener('click', function () { applyUITheme(b.dataset.ui); }); });
  // 他界：詰み防止の強制死亡（押したあと、その場で確認する）
  function taikaiAsk(on) {
    $('taikaiAsk').hidden = !on;
    $('taikai').hidden = on;
    $('taikaiHint').hidden = on;
  }
  $('taikai').addEventListener('click', function () { taikaiAsk(true); });
  $('taikaiNo').addEventListener('click', function () { taikaiAsk(false); });
  $('taikaiYes').addEventListener('click', function () {
    taikaiAsk(false);
    var P = G && G.player;
    if (!P || G.phase !== 'play' || P.mode === 'dead' || P.mode === 'clear') { showNote('今は他界できません。ステージの途中で押してください。'); return; }
    log('自ら他界した');
    P.shield = 0; P.def = 0; P.defT = 0;
    hurtPlayer(P.hp + 1e9);
  });
  $('giveK').addEventListener('click', function () { save.ketsu += Math.max(1000, Math.floor(save.ketsu)); writeSave(); syncUI(); });
  $('giveU').addEventListener('click', function () { save.uri += 5; save.uriEver = true; writeSave(); syncUI(); });
  // テスト用：すべての強化・解放・武装を最大に（費用なし）
  $('maxAll').addEventListener('click', function () {
    UPS.forEach(function (u) { save.up[u.id] = u.max; });
    save.uriEver = true;
    writeSave();
    log('テスト用：全強化を最大にした');
    showNote('全てのアップグレードを最大まで強化しました。');
    syncUI(true);
  });
  var resetBtn = $('reset'), resetArm = 0;
  resetBtn.addEventListener('click', function () {
    if (!resetArm) {
      resetBtn.classList.add('warn');
      resetBtn.textContent = 'もう一度で消去';
      resetArm = setTimeout(function () { resetArm = 0; resetBtn.classList.remove('warn'); resetBtn.textContent = '記録消去'; }, 3000);
      return;
    }
    clearTimeout(resetArm); resetArm = 0;
    resetBtn.classList.remove('warn'); resetBtn.textContent = '記録消去';
    save = freshSave();
    RUN.cd = { vul: 0, gren: 0, hyo: 0, yaj: 0 };
    curTab = 'home';
    writeSave();
    G.phase = 'reset';
    enterStage();                                   // 会話シーンも最初から（STAGE 1 の会話など）
    syncUI(true);
    if (opWanted()) showOp(function () { enterStage(); syncUI(true); }, true);    // 記録消去のあと：オープニングから
    else showNote('記録を消去しました。STAGE 1 から始めます。');
  });

  // 全画面：使える端末（PC、一部のタブレットなど）だけ動く
  var fsBtn = $('fs');
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function syncFs() {
    var on = !!fsElement();
    fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    fsBtn.textContent = on ? '全画面を終了' : '全画面';
  }
  function fsFail() { showNote('この端末やアプリでは全画面にできません。ブラウザで開き、横向きにしてバーを隠してください。'); }
  fsBtn.addEventListener('click', function () {
    var root = document.documentElement;
    try {
      if (fsElement()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (!req) { fsFail(); return; }
      var result = req.call(root);
      if (result && result.catch) result.catch(fsFail);
      if (screen.orientation && screen.orientation.lock && result && result.then) {
        result.then(function () { return screen.orientation.lock('landscape'); }).catch(function () {});
      }
    } catch (e) { fsFail(); }
  });
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);

  applyUITheme(uiThemeId);
  new ResizeObserver(layout).observe(stageEl);
  window.addEventListener('orientationchange', layout);
  layout();

  // ===== 起動 =====
  function start(data) {
    readSave();
    if (data && data.save) applySave(data.save);
    enterStage();
    syncUI(true);
    if (opWanted()) showOp(function () { enterStage(); syncUI(true); }, false);   // 初回起動：オープニング
    checkNoDieNote();
    requestAnimationFrame(frame);
  }
  var hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(function () { return { save: save }; }); } catch (e) {}
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

</body>
</html>
